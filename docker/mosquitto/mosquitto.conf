# Eclipse Mosquitto configuration for the MVP 1 demo stack.
# Demo only: anonymous access and no TLS (see docs/RUNBOOK.md); not a production configuration.

# Mosquitto 2.0 only accepts local connections without an explicit listener.
listener 1883 0.0.0.0
allow_anonymous true

# MVP 1 has no persistence; the gateway publishes with retain=false.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
